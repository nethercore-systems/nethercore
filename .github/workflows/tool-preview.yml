name: Tool Preview Packet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/preview-pack/**'
      - 'examples/**'
      - 'docs/book/**'
      - '.github/workflows/tool-preview.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-preview:
    name: Build preview packet
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Check C example toolchain
        shell: pwsh
        run: |
          "C:\Program Files\LLVM\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          & "C:\Program Files\LLVM\bin\clang.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Clang is required; C examples cannot be skipped" }
          & "C:\Program Files\LLVM\bin\wasm-ld.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Clang's WASM linker is required" }

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tool-preview-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tool-preview-

      - name: Build player, library, and CLI
        run: cargo build --release -p nethercore-zx -p nethercore-library -p nether-cli

      - name: Verify Rust C Zig first cartridges after relocation
        shell: pwsh
        run: |
          python examples/1-getting-started/hello-world/check.py --nether "$pwd/target/release/nether.exe" --player "$pwd/target/release/nethercore-zx.exe" --output "$env:RUNNER_TEMP/zx-first-cartridges"
          if ($LASTEXITCODE -ne 0) { throw "A first-cartridge language failed" }

      - name: Upload first-cartridge checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-cartridge-checks
          path: ${{ runner.temp }}/zx-first-cartridges
          retention-days: 14

      - name: Build examples
        run: cargo xtask build-examples

      - name: Assemble preview packet
        shell: pwsh
        run: |
          .\tools\preview-pack\assemble-preview-pack.ps1 -IncludeLocalTools

      - name: Zip preview packet
        shell: pwsh
        run: |
          Compress-Archive -Path target\tool-preview\nethercore-zx-tool-preview\* -DestinationPath target\tool-preview\nethercore-zx-tool-preview.zip -Force

      - name: Upload preview packet
        uses: actions/upload-artifact@v4
        with:
          name: nethercore-zx-tool-preview
          path: target/tool-preview/nethercore-zx-tool-preview.zip
          retention-days: 14
